services:
  - type: web
    name: taiwan-stock-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: HOLDER_ALERT_ENABLED
        value: "false"
      - key: HOLDER_ALERT_DRY_RUN
        value: "true"
      - key: HOLDER_ALERT_TICKERS
        value: "2330.TW"
      - key: TZ
        value: Asia/Taipei
      - key: PYTHON_VERSION
        value: "3.11.11"
